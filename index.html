<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沉降｜Descent</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", sans-serif;
      color: #eee;
      min-height: 100vh;
      background-image: url("mainbg.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* 標題區：移到頂部，半透明墊底讓字清楚 */
    .hero {
      text-align: center;
      padding: 50px 20px 40px;
      background-color: rgba(26, 26, 46, 0.5);
    }
    .hero h1 {
      font-size: 3em;
      color: #3a0101;
      margin: 0 0 10px;
      letter-spacing: 2px;
    }
    .hero .subtitle {
      color: #cfd3e0;
      margin: 0;
      letter-spacing: 1px;
    }

    /* 按鈕區：兩欄三列 */
    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .menu a {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 120px;
      background-color: rgba(22, 33, 62, 0.35);
      color: #eee;
      text-decoration: none;
      border-radius: 12px;
      border-left: 4px solid #e94560;
      font-size: 1.2em;
      letter-spacing: 1px;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .menu a .thumb {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .menu a span {
      position: relative;
      z-index: 1;
    }

    .menu a:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(204, 32, 61, 0.35);
    }
    .menu a:hover .thumb {
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      .menu { grid-template-columns: 1fr; }
      .hero h1 { font-size: 2.2em; }
    }
  </style>
</head>
<body>

  <header class="hero">
    <h1>沉降｜Descent</h1>
    <p class="subtitle">D&D 跑團記錄</p>
  </header>

  <div class="menu">
    <a href="resources.html">
      <div class="thumb" style="background-image: url('thumb-resources.jpg');"></div>
      <span>補充資料</span>
    </a>
    <a href="lore.html">
      <div class="thumb" style="background-image: url('thumb-lore.jpg');"></div>
      <span>背景設定</span>
    </a>
    <a href="locations.html">
      <div class="thumb" style="background-image: url('thumb-locations.jpg');"></div>
      <span>地點資訊</span>
    </a>
    <a href="characters.html">
      <div class="thumb" style="background-image: url('thumb-characters.jpg');"></div>
      <span>角色</span>
    </a>
    <a href="main.html">
      <div class="thumb" style="background-image: url('thumb-main.jpg');"></div>
      <span>主線故事</span>
    </a>
    <a href="gallery.html">
      <div class="thumb" style="background-image: url('thumb-gallery.jpg');"></div>
      <span>漫畫與動畫</span>
    </a>
  </div>

</body>
</html>
